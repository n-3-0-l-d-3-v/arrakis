<text x="200" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#7d6a52" text-anchor="end" xml:space="preserve" font-variant="small-caps">Catalogue</text>
<text x="216" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#2b2118" text-anchor="start" xml:space="preserve" >examples/fib.ck</text>
<text x="200" y="412" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#7d6a52" text-anchor="end" xml:space="preserve" font-variant="small-caps">Format</text>
<text x="216" y="412" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#2b2118" text-anchor="start" xml:space="preserve" >PDF 1.7, one page, one embedded file</text>
<text x="200" y="434" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#7d6a52" text-anchor="end" xml:space="preserve" font-variant="small-caps">Contents</text>
<text x="216" y="434" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#2b2118" text-anchor="start" xml:space="preserve" >11 blocks of mentat bytecode, 75 instructions</text>
<text x="200" y="456" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#7d6a52" text-anchor="end" xml:space="preserve" font-variant="small-caps">Payload</text>
<text x="216" y="456" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#2b2118" text-anchor="start" xml:space="preserve" >4444 bytes</text>
<text x="200" y="478" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#7d6a52" text-anchor="end" xml:space="preserve" font-variant="small-caps">Entry</text>
<text x="216" y="478" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#2b2118" text-anchor="start" xml:space="preserve" >block b9 ("driver")</text>
<text x="200" y="500" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#7d6a52" text-anchor="end" xml:space="preserve" font-variant="small-caps">Seal (sha256)</text>
<text x="216" y="500" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11" fill="#2b2118" text-anchor="start" xml:space="preserve" >8f1d2ac10b8880b13294ced79af56ab1</text>
<text x="200" y="522" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#7d6a52" text-anchor="end" xml:space="preserve" font-variant="small-caps"></text>
<text x="216" y="522" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11" fill="#2b2118" text-anchor="start" xml:space="preserve" >7b759bf8a7b68c232e84c366d2413316</text>
<line x1="90" y1="536" x2="505" y2="536" stroke="#2b2118" stroke-width="0.6"/>
<text x="297.5" y="574" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b2118" text-anchor="middle" xml:space="preserve" >This page is an ordinary document. Opening it runs nothing.</text>
<text x="297.5" y="593" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b2118" text-anchor="middle" xml:space="preserve" >The program inside is verified against its seal before it may run,</text>
<text x="297.5" y="612" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b2118" text-anchor="middle" xml:space="preserve" >and then only in a sandbox with no host access and a step budget.</text>
<text x="297.5" y="631" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b2118" text-anchor="middle" xml:space="preserve" >Change one character of it, and it is refused.</text>
<text x="297.5" y="676" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11" fill="#7d6a52" text-anchor="middle" xml:space="preserve" >arrakis inspect fib.pdf        arrakis open fib.pdf</text>
<text x="297.5" y="782" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#7d6a52" text-anchor="middle" xml:space="preserve" letter-spacing="2">shai-hulud  ·  ARRAKIS</text>
</svg>