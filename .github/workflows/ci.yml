name: CI

# The subsystems run their own CI in their standalone repositories. This
# workflow covers what only exists here: the integration crate, the `arrakis`
# CLI, and the quickstart that a newcomer runs first.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --manifest-path integration/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path integration/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release --manifest-path integration/Cargo.toml

  quickstart:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Quickstart (bash)
        if: runner.os != 'Windows'
        run: ./arrakis.sh
      - name: Quickstart (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./arrakis.ps1
