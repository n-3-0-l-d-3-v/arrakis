name: Audit

# Checks the committed root Cargo.lock against the RustSec advisory database:
# weekly (advisories appear without any change here), whenever the lockfile
# changes, and on demand.

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [ main ]
    paths: [ "Cargo.lock", "**/Cargo.toml" ]
  pull_request:
    paths: [ "Cargo.lock", "**/Cargo.toml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock
        run: cargo audit --file Cargo.lock
